<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The `any`-purpose icon TEMPLATE: a rounded tile and a cairn of four stones. `@BACKGROUND@`,
       `@STONE@` and `@SHADE@` are substituted per variant from `variants.json` by `flake.nix`'s
       `uiIcons`, which renders this with resvg; the PNGs beside it are that build's output and are
       never hand-edited (`checks.ui-icons-are-current`). No text: a font is a host dimension. -->
