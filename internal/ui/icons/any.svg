  <g>
    <ellipse cx="256" cy="384" rx="150" ry="52" fill="@SHADE@"/>
    <ellipse cx="256" cy="372" rx="150" ry="52" fill="@STONE@"/>
    <ellipse cx="250" cy="292" rx="112" ry="44" fill="@SHADE@"/>
    <ellipse cx="250" cy="280" rx="112" ry="44" fill="@STONE@"/>
    <ellipse cx="262" cy="212" rx="76" ry="36" fill="@SHADE@"/>
    <ellipse cx="262" cy="200" rx="76" ry="36" fill="@STONE@"/>
    <ellipse cx="254" cy="148" rx="42" ry="24" fill="@SHADE@"/>
    <ellipse cx="254" cy="138" rx="42" ry="24" fill="@STONE@"/>
  </g>
</svg>
