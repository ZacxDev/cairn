# Publish the server images to a PUBLIC registry, so a cluster that holds no
# credential for this repository can pull them.
#
# 🔴 TWO PODS, TWO GHCR PACKAGES, ONE WORKFLOW. `packages.server-image` is the
# PYTHON pod and `packages.server-image-go` is the Go one; they go to
# `cairn-store` and `cairn-store-go` respectively, never to two tags of one
# package. The reason is READABILITY OF THE TAG LIST: a package holding one
# implementation can be pinned by reading it, and a mixed list distinguished only
# by a tag prefix reads as a mistake to whoever finds it later. Their tag SCHEMES
# are identical on purpose: `sha-<40-hex>` derived from the same rev, so one
# revision names one artefact in each package and the two are comparable.
#
# 🔴 AN EARLIER DRAFT JUSTIFIED THIS BY VISIBILITY — "sharing a package would flip
# the Go pod public as a side effect of the Python one" — AND THAT WAS BACKWARDS.
# `cairn-store` is ALREADY public (measured: an anonymous tag-list read answers
# 200), and the job below FAILS unless the Go pod is anonymously pullable, so the
# "side effect" being avoided was the state this workflow is trying to reach. The
# retracted reason is recorded rather than deleted so nobody derives it again.
# ⚠ A SECOND PREDICTION IN THIS PARAGRAPH WAS ALSO WRONG — it said the first run
# publishing a NEW package "goes red until a one-time manual flip". It did not:
# `cairn-store-go` was created PUBLIC by Actions and its proof passed first time.
# The separate package's real cost is therefore smaller than stated here, and the
# retraction with its scope lives at that step.
#
# 🔴 AND THE GO HALF RUNS FIRST, WHOLE, BECAUSE `cairn-store-go` IS THE DEPLOYED
# POD. Build, controls, both pushes and the anonymous-pull proof for
# `cairn-store-go` all complete before the FIRST Python-image step. The rule the
# ordering encodes: THE POD THE CLUSTER ACTUALLY PULLS PUBLISHES FIRST, so it is
# the leg LEAST exposed to an earlier step going red. Every step is exposed to
# every step in front of it; the only question this file gets to answer is which
# artefact sits at the front.
#
# ⚠ THE RETRACTED ORDERING AND ITS RETRACTED REASON, KEPT SO NOBODY RE-DERIVES
# THEM. The Python half used to run first, and the argument was: "`ci.yml` asserts
# only that the Go image BUILDS, so every Go step here is a FIRST execution, and a
# first execution in front of the Python publish gates that publish on a path that
# has never run once — the same shape as the failure this file was written to fix,
# seven runs in a row where nothing published because one step nobody had
# exercised went red." Both halves of that are spent. MEASURED before the
# reversal: the last fifteen runs of this workflow are 14 success / 1 cancelled,
# and a recent successful run executed `push the Go pod's immutable sha tag` AND
# `push the Python pod's immutable sha tag` to success — so NEITHER half is a
# first execution any more. And the pod the old ordering protected is the one
# NOTHING deploys: the cutover made `cairn-store-go` the deployed pod, so the
# Python-first ordering published the DEPLOYED pod LAST and most exposed, which
# is the opposite of what its own rationale asked for.
# `tests/test_publish_workflow.py` pins the ORDER, not only the membership.
#
# 🔴 WHY THIS EXISTS, AND WHAT WAS ACTUALLY MEASURED. `ci.yml`'s `nix` job builds
# `packages.server-image` and asserts nothing further — its own comment says so:
# "This asserts it BUILDS; that it RUNS is not asserted here". Nothing in this
# repository has ever PUBLISHED it. Measured on `main` before this file existed:
# every publish-shaped token in `ci.yml` — `docker/login`, `docker/build-push`,
# `registry`, `ghcr`, `skopeo`, `nix copy`, `docker push`, `crane`,
# `packages: write` — returned ZERO, against a positive control of 1 for
# `server-image`; and a paginated enumeration of the owner's container packages
# returned 20 names, none of them this one. The only publish path that existed
# was `server/build-push.sh`, which is run BY HAND, requires the operator to name
# a registry (`CAIRN_REGISTRY`, no default), and in practice targets a LAN-only
# host that a second cluster cannot resolve, let alone reach.
#
# 🔴 A SEPARATE WORKFLOW, NOT A JOB IN `ci.yml`, AND THAT IS THE FORK-PR GUARD.
# "PRs must not publish" can be written as an `if:` on a job, and an `if:` is one
# edit away from being wrong. Here the trigger set simply has no pull-request
# member: there is no event a fork can raise that reaches this file, so the
# property is structural rather than conditional.
# `tests/test_publish_workflow.py` pins the trigger set by EQUALITY — adding any
# trigger, whatever it is called, turns that test red — because the hazard is the
# class (`pull_request`, `pull_request_target`, `workflow_run` on a
# PR-triggered workflow), not the one spelling somebody thought to ban.
#
# 🔴 THE TAG IS IMMUTABLE AND THERE IS NO `latest`. `server/build-push.sh` states
# the reason and it is this repository's own position: "A `:latest` default is how
# a mutable tag gets clobbered by a concurrent build and a pod silently restarts
# on somebody else's code." The consuming design says both clusters pull the SAME
# tag; a tag whose contents can change under a running deployment does not satisfy
# that sentence, it only looks like it does. So: `sha-<40-hex commit sha>` always,
# plus a bare semver on a version tag push. Both are derivable from a rev, which
# is what "the same tag" needs in order to be checkable.
name: publish-image

on:
  push:
    branches: [main]
    # A push filter carrying BOTH `branches` and `tags` matches on EITHER, so a
    # version tag publishes without also having to land on `main` a second time.
    tags: ["*"]
  # Present so an operator can re-publish a revision without an empty commit —
  # e.g. after the one-time visibility flip described in `server/README.md`.
  # It is a WRITE trigger that only a collaborator can fire, which is why it is
  # in the pinned set and `pull_request` is not.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # Two runs on the same ref would compute the same immutable tag and push
  # byte-identical content, so a race here cannot clobber anything. Serialised
  # anyway, and NOT cancelled: a cancelled publish leaves a half-known state,
  # which is worse than a duplicated one.
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 🔴 FULL HISTORY, DELIBERATELY. `flake.nix` derives the image's own tag
      # from `self.shortRev` and falls back to the string `"unknown"` when it
      # cannot resolve one. A shallow checkout is exactly the condition under
      # which that fallback fires, and it fires SILENTLY — the build succeeds and
      # ships an artefact labelled `unknown`, which is the mislabelling that
      # comment was written to prevent. `fetch-depth: 0` removes the question.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # 🔴 THE TAGS ARE COMPUTED IN ONE PLACE AND PRINTED, because every later
      # step and every consumer reads them, and a tag nobody can see in the log
      # is a tag nobody can check a deployment against.
      #
      # The owner is lower-cased because a registry path component must be, and
      # this repository's owner is not: `ZacxDev` is a 404 as a ghcr namespace.
      # Derived rather than hardcoded so a fork publishes into ITS own namespace
      # instead of failing against one it cannot write.
      - name: derive the image references and their immutable tag
        id: ref
        run: |
          set -euo pipefail
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/cairn-store"
          # 🔴 A SECOND PACKAGE, NOT A SECOND TAG OF THE FIRST — and the reason is
          # the TAG LIST, not visibility. A list mixing two implementations,
          # separated only by a tag prefix, cannot be read by anyone pinning one.
          # Do NOT restore the visibility argument: `cairn-store` is already
          # public, so it was backwards. The header records why.
          image_go="ghcr.io/$owner/cairn-store-go"
          # 🔴 A THIRD PACKAGE, AND IT IS THE BROWSER SURFACE RATHER THAN A POD.
          # `cairn-ui` serves no `/api/v1` route, so it is not interchangeable with
          # either pod and gets its own package rather than a tag of one: a consumer
          # who pulled the wrong one would get a container that starts, health-checks
          # and answers nothing they asked for.
          image_ui="ghcr.io/$owner/cairn-ui"
          # The 40-hex commit sha, not the short one. Both are derivable from a
          # rev; only the full one cannot collide, and a registry tag is the
          # thing a cluster pins for months. ONE tag scheme for both packages, so
          # a revision names one artefact in each and the two are comparable.
          sha_tag="sha-${{ github.sha }}"
          printf 'image=%s\n' "$image"      >> "$GITHUB_OUTPUT"
          printf 'image_go=%s\n' "$image_go" >> "$GITHUB_OUTPUT"
          printf 'image_ui=%s\n' "$image_ui" >> "$GITHUB_OUTPUT"
          printf 'sha_tag=%s\n' "$sha_tag"  >> "$GITHUB_OUTPUT"

          version_tag=""
          case "${{ github.ref }}" in
            refs/tags/*)
              raw="${GITHUB_REF#refs/tags/}"
              # A leading `v` is stripped so the published tag matches the
              # convention the deployed image already uses (`…:0.8.1`) and the
              # argument `server/build-push.sh` takes (`0.8.0`). Both spellings
              # of the git tag therefore land on one registry tag.
              version_tag="${raw#v}"
              ;;
          esac
          printf 'version_tag=%s\n' "$version_tag" >> "$GITHUB_OUTPUT"

          echo "image        = $image"
          echo "image (go)   = $image_go"
          echo "sha tag      = $sha_tag"
          echo "version tag  = ${version_tag:-<none: not a tag push>}"

      # ── THE TWO SHARED PREREQUISITES, ABOVE BOTH HALVES AND BELONGING TO
      # NEITHER. skopeo is the binary every push and every anonymous-pull proof
      # runs, and the ghcr login is what every push needs; they sit here rather
      # than inside a half because whichever half goes first would otherwise own
      # them, and the next reordering would strand the other half with no binary
      # and no credential. They were inside the PYTHON half while that half ran
      # first, which is exactly the coupling this position removes.
      # ─────────────────────────────────────────────────────────────────────────

      # 🔴 skopeo IS TAKEN FROM THE FLAKE'S OWN PINNED nixpkgs, NOT FROM THE
      # RUNNER IMAGE. GitHub's ubuntu image happens to ship one today; a job whose
      # verdict depends on what a runner image happens to contain is a job whose
      # verdict cannot be reproduced by running the same lines locally, and runner
      # images change without telling anybody. `--inputs-from .` resolves
      # `nixpkgs#` through `flake.lock`, so this is the same nixpkgs everything
      # else here is built from.
      #
      # 🔴 AND THE ATTRIBUTE NAMES AN OUTPUT — `.out` — BECAUSE THE BARE ONE
      # FAILED EVERY SINGLE RUN. MEASURED: `nixpkgs#skopeo` declares
      # `outputs = ["out" "man"]`, so `nix build … --print-out-paths` prints TWO
      # store paths and the `-man` one comes FIRST. The earlier step captured that
      # into `out` and then ran `"$out/bin/skopeo"`, which is a TWO-LINE command —
      # the runner reported `No such file or directory` and `exit code 127` —
      # while `printf 'bin=%s/bin/skopeo\n' "$out" >> "$GITHUB_OUTPUT"` wrote a
      # multi-line value that `$GITHUB_OUTPUT` rejects with `Invalid format`.
      # Every run of this workflow died here, at this step.
      #
      # 🔴 THE SELECTION IS NIX'S, NOT A PARSE OF ITS OUTPUT, AND THAT IS WHAT
      # MAKES IT STRUCTURAL. Measured at this flake's pinned lock on nix 2.34.8:
      # `nixpkgs#skopeo` prints 2 lines (`…-man` first), `nixpkgs#skopeo.out`
      # prints 1, and `$out/bin/skopeo --version` answers `skopeo version 1.24.0`.
      # The alternatives all parse the same text — "take the last line", "drop
      # anything ending in `-man`", or probe the printed candidates for an
      # executable `bin/skopeo` — and every one of them is a guess that a `dev`
      # output, a changed output order or a platform-specific `debug` output can
      # walk past. None of those change what `.out` NAMES.
      # (`nixpkgs#skopeo^out` selects the same output; the attribute-path
      # spelling is older and needs no shell quoting, which is why it is used.)
      #
      # `--version` stays: it is the positive control that the resolved path is
      # really a skopeo, and no amount of correct selection asserts that.
      - name: pin skopeo to the flake's nixpkgs
        id: skopeo
        run: |
          set -euo pipefail
          out=$(nix build --inputs-from . nixpkgs#skopeo.out \
                  --no-link --print-out-paths)
          bin="$out/bin/skopeo"
          printf 'bin=%s\n' "$bin" >> "$GITHUB_OUTPUT"
          echo "skopeo = $bin"
          "$bin" --version

      # `GITHUB_TOKEN`, not a stored secret. The token is scoped to this
      # repository and expires with the run, so there is nothing here for a
      # future contributor to leak or rotate.
      - name: log in to ghcr
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' \
            | "${{ steps.skopeo.outputs.bin }}" login ghcr.io \
                -u '${{ github.actor }}' --password-stdin

      # ── THE GO POD, AND IT GOES FIRST BECAUSE IT IS THE DEPLOYED ONE. Build,
      # controls, both pushes and the anonymous-pull proof for `cairn-store-go`
      # all complete before the FIRST Python-image step below. The cluster pulls
      # THIS package, so it is the leg that must be least exposed to an earlier
      # step going red.
      # ⚠ THIS BLOCK USED TO SIT SECOND AND READ "Nothing below this line runs
      # until the Python pod above is built, controlled, pushed and proved
      # anonymously pullable … every step from here down is a FIRST execution of
      # an image nothing in this repository has ever run." The second half is
      # spent: this half has published green, measured on this workflow's own run
      # history, so it is not a first execution. Kept so nobody re-derives it.
      # ─────────────────────────────────────────────────────────────────────────

      # 🔴 THE GO POD IS BUILT HERE AND PUBLISHED BELOW, AND IT IS WHAT RUNS.
      # ⚠ This read "NOTHING DEPLOYS IT YET" and cited `flake.nix` as saying the
      # Go image is deployed by nothing. The first half was stale — the cluster
      # pulls `cairn-store-go`. 🔴 THE SECOND HALF WAS TRUE, AND AN EARLIER DRAFT
      # OF THIS SWEEP RETRACTED IT AS NEVER-TRUE: `flake.nix` DID say it, at the
      # `server-image-go` block ("PUBLISHED IS NOT DEPLOYED — no manifest
      # references it"), which that draft had not opened while editing the same
      # file. Both are corrected now. Retracting a TRUE claim is the same defect
      # as leaving a false one, pointed the other way.
      # `ci.yml` does still assert only that it BUILDS. What changes HERE is
      # publication, not deployment:
      # `cairn-store-go` gets the same immutable tags as the Python package so
      # that pointing a pod at it is a manifest edit rather than a build,
      # and so the two pods over one revision can be pulled and compared.
      #
      # `buildLayeredImage` is single-output, so `--print-out-paths` prints one
      # line here — unlike `nixpkgs#skopeo` above, which is why that step names
      # `.out` rather than the bare attribute.
      - name: build the Go server image from the flake
        id: build-go
        run: |
          set -euo pipefail
          out=$(nix build .#packages.x86_64-linux.server-image-go \
                  --no-link --print-out-paths --print-build-logs)
          printf 'archive=%s\n' "$out" >> "$GITHUB_OUTPUT"
          echo "archive = $out"
          ls -l "$out"

      # 🔴 THE GO POD'S OWN CONTROLS, AND WHICH ONES TRANSFER WAS MEASURED RATHER
      # THAN ASSUMED. Copying the Python control step wholesale is the obvious
      # move and it is wrong in one specific place:
      #
      #   * `/data` is empty — TRANSFERS. Both images report 0, through the same
      #     `/bin/busybox`: `flake.nix`'s `goServerTools` is `serverTools` plus CA
      #     roots, so busybox and `PATH=/bin` are present here too.
      #   * the image RUNS and REFUSES BY NAME with no token source — TRANSFERS.
      #     The Go server prints the same `subsystem-store-api:` prefix and exits
      #     non-zero (78, EX_CONFIG — asserted as "non-zero and named" here
      #     because the exact code is `cmd/cairn-server`'s own printed contract,
      #     pinned by `main_test.go`, and restating it here would be a second
      #     spelling of it).
      #   * the POSITIVE control does NOT transfer. The Python step runs the
      #     image's own `Cmd[0]` — an interpreter — with `-c 'import …'`. This
      #     image's `Cmd[0]` is the SERVER BINARY, which has no `-c` and answers
      #     `flag provided but not defined: -c`. The Go equivalent is the route
      #     ledger: `cairn-server -routes`, read out of the RUNNING image, which
      #     is the one claim a build cannot make.
      #
      # 🔴 AND IT ASSERTS THE LEDGER IS NON-EMPTY AND THE BINARY EXITED 0 — IT
      # DOES NOT NAME ROUTES, DELIBERATELY. `AGENTS.md` states that adding a route
      # moves FOUR ledgers together: `api.DeclaredRoutes()`,
      # `tests/conformance/requests.json`, the construction check, and
      # `checks.go-server-declares-its-routes`. Route names written out here would
      # be a FIFTH spelling that none of those four can see — rename a route and
      # all four stay green while this job refuses mid-push, after the Python pod
      # has already been published. The question a publish control exists to
      # answer is "can this binary ever observe the thing": a zero-line ledger or
      # a non-zero exit fails loudly here, and WHICH routes are declared is the
      # four ledgers' claim rather than this one's.
      #
      # 🔴 "FAILS LOUDLY" IS AN EXIT CODE, NOT A SENTENCE, AND THAT DISTINCTION
      # WAS MEASURED. Flipping this step's empty-ledger `exit 1` to `exit 0` left
      # `REFUSING TO PUBLISH` and `EMPTY` both present and the suite fully green:
      # the control printed a refusal and published anyway. The guard that
      # asserted those two words is gone;
      # `test_no_control_step_can_REFUSE_and_exit_ZERO` reads the `exit`
      # STATEMENTS of all four control steps and the branch on `$declared`.
      - name: control — the GO image is EMPTY of store data, declares its routes, and refuses
        run: |
          set -euo pipefail
          loaded=$(docker load -i "${{ steps.build-go.outputs.archive }}" \
                   | sed -n 's/^Loaded image: //p')
          echo "loaded = $loaded"
          test -n "$loaded"

          leaked=$(docker run --rm --entrypoint /bin/busybox "$loaded" \
                     sh -c 'ls -A /data | wc -l')
          if [ "$leaked" != "0" ]; then
            echo "REFUSING TO PUBLISH: /data in the Go image holds $leaked entr(y|ies)."
            echo "  This image is about to become PUBLIC. Store content must arrive"
            echo "  at runtime on a volume and must never be in a layer."
            docker run --rm --entrypoint /bin/busybox "$loaded" sh -c 'ls -A /data'
            exit 1
          fi
          echo "control: /data holds $leaked files (must be 0) — OK"

          # The positive half of that zero: the server binary really is in the
          # image, it runs, it exits 0, and it declares SOMETHING. The exit code
          # is captured rather than left to `set -e` so the refusal below can say
          # WHICH half failed — an empty ledger and a binary that would not start
          # are different facts about the image.
          server=$(docker inspect -f '{{index .Config.Cmd 0}}' "$loaded")
          echo "server (from the image's own Cmd) = $server"
          set +e
          routes=$(docker run --rm --entrypoint "$server" "$loaded" -routes)
          routes_rc=$?
          set -e
          declared=$(printf '%s\n' "$routes" | grep -c . || true)
          echo "$routes"
          if [ "$routes_rc" -ne 0 ] || [ "$declared" -eq 0 ]; then
            echo "REFUSING TO PUBLISH: the route ledger is EMPTY, or the binary did"
            echo "  not exit 0 (rc=$routes_rc, non-blank lines=$declared)."
            echo "  A command that printed nothing and exited 0 is indistinguishable"
            echo "  from one wired to nothing, and the /data zero above would then be"
            echo "  the only measurement left — which an image with no filesystem"
            echo "  would also satisfy."
            exit 1
          fi
          echo "positive control: the server ran, exited 0 and declared $declared ledger line(s) — OK"

          # …and the image RUNS: with no token source it must refuse for a NAMED
          # configuration reason and exit non-zero, exactly as the Python pod does.
          set +e
          startup=$(docker run --rm "$loaded" 2>&1)
          rc=$?
          set -e
          echo "no-config start: rc=$rc"
          echo "$startup"
          if [ "$rc" -eq 0 ]; then
            echo "REFUSING TO PUBLISH: the Go server exited 0 with no token source."
            echo "  It is supposed to refuse. A 0 here means the entrypoint is not"
            echo "  running the server at all."
            exit 1
          fi
          case "$startup" in
            *"subsystem-store-api:"*) ;;
            *) echo "REFUSING TO PUBLISH: the refusal did not come from the server"
               exit 1 ;;
          esac
          echo "control: the Go image runs and refuses by name — OK"

      - name: push the Go pod's immutable sha tag
        run: |
          set -euo pipefail
          "${{ steps.skopeo.outputs.bin }}" copy --all \
            "docker-archive:${{ steps.build-go.outputs.archive }}" \
            "docker://${{ steps.ref.outputs.image_go }}:${{ steps.ref.outputs.sha_tag }}"

      - name: push the Go pod's version tag, on a tag push only
        if: steps.ref.outputs.version_tag != ''
        run: |
          set -euo pipefail
          "${{ steps.skopeo.outputs.bin }}" copy --all \
            "docker-archive:${{ steps.build-go.outputs.archive }}" \
            "docker://${{ steps.ref.outputs.image_go }}:${{ steps.ref.outputs.version_tag }}"

      # 🔴 THIS STEP WAS PREDICTED TO FAIL ON ITS FIRST RUN. IT DID NOT, AND THE
      # RETRACTION IS KEPT SO NOBODY RE-DERIVES THE PREDICTION.
      # The claim was: `cairn-store-go` is a NEW ghcr package, a ghcr package is
      # PRIVATE on first publish, so this step refuses until a manual flip.
      # MEASURED on the first run that ever reached it: the package was created
      # **public**, this step passed, and an anonymous `skopeo inspect` from an
      # unauthenticated host answered 200 — against a negative control (an absent
      # tag) that was refused, so the instrument was not vacuous.
      #
      # ⚠ SCOPE, because one observation is not a general rule: that was ONE
      # package, created BY ACTIONS, in a PUBLIC repository. It does NOT
      # establish what happens for a private repo, for a hand-pushed package, or
      # for an org-owned one — the visibility a package inherits at creation is
      # GitHub's behaviour, not this workflow's, and nothing here pins it.
      # So the refusal below STAYS: it is cheap, and it is the only thing that
      # would catch the case where the inheritance does not happen.
      #
      # …once, by hand, and re-runs the workflow (`workflow_dispatch` is in the
      # trigger set for exactly this). The same thing happened to `cairn-store`;
      # the step below prints the owner-substituted URL when it refuses.
      #
      # 🔴 THE STEP IS NOT SOFTENED FOR THAT. A `continue-on-error` here would
      # make the first run green and every LATER regression green too — and a
      # private image and a working one are indistinguishable from inside this
      # job, which is the whole reason this check exists. An expected failure
      # that is explained is cheaper than a gate that cannot fail.
      #
      # 🔴 AND THE WHOLE GO HALF NOW RUNS BEFORE THE WHOLE PYTHON ONE, NOT ONLY
      # THIS STEP. The deployed pod publishes first, so this half is the one least
      # exposed to an earlier red step; a step of the PYTHON half going red can no
      # longer strand it.
      # ⚠ TWO RETRACTED VERSIONS OF THIS PARAGRAPH, KEPT SO NEITHER IS RE-DERIVED.
      # It first read "the whole Go half runs AFTER the whole Python one … an
      # earlier draft put the Go build and the Go controls in front of the Python
      # push and claimed 'it runs last' on the strength of this step alone — which
      # left the THEN-deployed Python pod unable to publish if any first-execution
      # Go step went red, the exact failure mode of the seven runs this file was
      # written to fix." Then it said "the pod that IS deployed", which named the
      # right pod only before the cutover. Both are spent: this half is no longer
      # a first execution — it has published green, measured on the run history —
      # and the pod the ordering protected is the one nothing pulls. The narrow
      # claim the first version got RIGHT survives and is the reason the step below
      # is still not softened: "it runs last" is a property of ONE step, never of
      # the half it is read as covering.
      - name: PROVE the published GO image is pullable with NO credentials
        run: |
          set -euo pipefail
          ref='${{ steps.ref.outputs.image_go }}:${{ steps.ref.outputs.sha_tag }}'
          skopeo='${{ steps.skopeo.outputs.bin }}'

          # This package's OWN negative control. The Python step's control says
          # nothing about this registry path: they are two packages with two
          # visibility settings, and an instrument proved honest about one of
          # them has not been proved honest about the other.
          set +e
          $skopeo inspect --no-creds \
            "docker://${{ steps.ref.outputs.image_go }}:sha-0000000000000000000000000000000000000000" \
            >/dev/null 2>&1
          control_rc=$?
          set -e
          if [ "$control_rc" -eq 0 ]; then
            echo "REFUSING: an anonymous inspect of a tag that does not exist SUCCEEDED."
            echo "  This check cannot distinguish a public image from anything."
            exit 1
          fi
          echo "negative control: absent tag refused anonymously (rc=$control_rc) — OK"

          set +e
          out=$($skopeo inspect --no-creds "docker://$ref" 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "$out"
            echo
            echo "REFUSING: $ref was PUSHED but cannot be pulled without credentials."
            echo
            echo "  🔴 IF THIS IS THE FIRST TIME THE GO PACKAGE HAS EVER PUBLISHED,"
            echo "     THIS FAILURE IS EXPECTED. A ghcr package is PRIVATE on first"
            echo "     publish and GitHub exposes no REST route to change that. It is"
            echo "     a ONE-TIME manual step, per package:"
            echo
            echo "    https://github.com/users/${{ github.repository_owner }}/packages/container/cairn-store-go/settings"
            echo "    -> Danger Zone -> Change visibility -> Public"
            echo
            echo "  Then re-run this workflow (workflow_dispatch). Until it is done, no"
            echo "  cluster outside this repository can pull the Go pod."
            exit 1
          fi
          echo "$out" | head -20
          digest=$(printf '%s' "$out" | sed -n 's/.*"Digest": "\([^"]*\)".*/\1/p' | head -1)
          echo
          echo "ANONYMOUS PULL OK: $ref"
          echo "digest: $digest"
          echo "pin this in a deployment: $ref"

      # ── THE PYTHON POD, AND IT GOES SECOND BECAUSE NOTHING DEPLOYS IT.
      # Everything about `cairn-store` — build, control, both pushes, and the
      # anonymous-pull proof — happens after the whole Go half above. ⚠ This read
      # "happens before the first Go step", which was true and is not: the
      # ordering reversed when `cairn-store-go` became the deployed pod. Publishing
      # this half is still load-bearing — it is the ORACLE, and the parity gate
      # compares against it until P8 — so a red step here still stops a publish;
      # it stops the publish of the pod that nothing pulls.
      # ─────────────────────────────────────────────────────────────────────────

      # 🔴 ONE BUILD, AND IT IS THE FLAKE'S. A second `docker build` here would
      # be a THIRD way to produce this pod, and the premise of
      # `tests/test_flake_image_matches_dockerfile.py` is that there are two and
      # they are pinned against each other. Publishing the nix output keeps the
      # published artefact inside that pin.
      - name: build the Python server image from the flake
        id: build
        run: |
          set -euo pipefail
          out=$(nix build .#packages.x86_64-linux.server-image \
                  --no-link --print-out-paths --print-build-logs)
          printf 'archive=%s\n' "$out" >> "$GITHUB_OUTPUT"
          echo "archive = $out"
          ls -l "$out"

      # 🔴 THE CONTROL THAT MATTERS MOST HERE, AND IT IS STRICTER THAN THE ONE IN
      # `server/build-push.sh` FOR A REASON: that script pushes to whatever
      # registry the operator names, usually a private one. This pushes to a
      # PUBLIC one. A store entry baked into a layer is a private note published
      # to the internet — the exact class the leak gate exists to stop, one step
      # past the leak gate's reach, because the leak gate reads the TREE and this
      # reads the ARTEFACT.
      #
      # 🔴 AND IT IS A PAIR. "`/data` holds 0 files" is also what an image with no
      # filesystem at all would report, and a reassuring zero is indistinguishable
      # from a probe wired to nothing. The second command is the positive half:
      # the code IS in the image and imports, so the zero above was measured
      # against a real root.
      #
      # 🔴 THE `/data` BLOCK IS PINNED THREE WAYS AND IT USED TO BE PINNED NONE.
      # MEASURED: deleting it from EITHER pod's control left the whole suite
      # green. `test_both_image_controls_REFUSE_on_a_non_empty_data_directory`
      # now reads the PROBE, the BRANCH on `$leaked`, and that branch's exit
      # code; this step's whole command text is pinned as well. Do not delete or
      # reword it without reading that test — and note that a variable which
      # merely EXISTS is not a guard, so moving the measurement out of the `if`
      # is the same defect as deleting it.
      - name: control — /data is EMPTY in the image, and the code is really there
        run: |
          set -euo pipefail
          loaded=$(docker load -i "${{ steps.build.outputs.archive }}" \
                   | sed -n 's/^Loaded image: //p')
          echo "loaded = $loaded"
          test -n "$loaded"

          leaked=$(docker run --rm --entrypoint /bin/busybox "$loaded" \
                     sh -c 'ls -A /data | wc -l')
          if [ "$leaked" != "0" ]; then
            echo "REFUSING TO PUBLISH: /data in the image holds $leaked entr(y|ies)."
            echo "  This image is about to become PUBLIC. Store content must arrive"
            echo "  at runtime on a volume and must never be in a layer."
            docker run --rm --entrypoint /bin/busybox "$loaded" sh -c 'ls -A /data'
            exit 1
          fi
          echo "control: /data holds $leaked files (must be 0) — OK"

          # 🔴 THE INTERPRETER IS READ OUT OF THE IMAGE'S OWN `Cmd`, NOT SPELLED
          # `python3`. It is NOT on this image's `PATH` — measured: `PATH=/bin`
          # and `/bin` is busybox alone, so `command -v python3` returns nothing.
          # `server/build-push.sh` gets away with the bare name because the
          # Dockerfile image is `python:3.12-slim` and inherits one; the flake
          # image names an absolute store path in `Cmd` instead. A control
          # written the other way would fail here for a reason that has nothing
          # to do with what it claims to measure.
          py=$(docker inspect -f '{{index .Config.Cmd 0}}' "$loaded")
          echo "interpreter (from the image's own Cmd) = $py"
          docker run --rm --entrypoint "$py" "$loaded" -c \
            'import sys; sys.path.insert(0, "/app/lib"); import subsystem_recall as r; print("positive control: subsystem_recall imported,", len(r.RECALL_MODES), "modes")'

          # …and the image RUNS: with no token source it must refuse for a NAMED
          # configuration reason and exit non-zero, which is a different claim
          # from "the container was created". A container that started and sat
          # there would satisfy a naive smoke test and tell you nothing.
          set +e
          startup=$(docker run --rm "$loaded" 2>&1)
          rc=$?
          set -e
          echo "no-config start: rc=$rc"
          echo "$startup"
          if [ "$rc" -eq 0 ]; then
            echo "REFUSING TO PUBLISH: the server exited 0 with no token source."
            echo "  It is supposed to refuse. A 0 here means the entrypoint is not"
            echo "  running the server at all."
            exit 1
          fi
          case "$startup" in
            *"subsystem-store-api:"*) ;;
            *) echo "REFUSING TO PUBLISH: the refusal did not come from the server"
               exit 1 ;;
          esac
          echo "control: the image runs and refuses by name — OK"

      # 🔴 `docker-archive:` READS THE GZIPPED TAR THE FLAKE PRODUCES DIRECTLY —
      # measured, not assumed: `dockerTools.buildLayeredImage` defaults to a gzip
      # compressor and skopeo detects it. No decompression step, and in
      # particular no change to the derivation's `compressor`, which would move
      # the artefact that `test_flake_image_matches_dockerfile.py` is pinned to.
      #
      # 🔴 EVERY PUSH STEP IN THIS FILE IS PINNED BY ITS WHOLE NORMALISED COMMAND
      # TEXT in `tests/test_publish_workflow.py`, not by a keyword. Which archive
      # goes to which package under which tag is the entire contract, and a guard
      # on words is walkable by rewording. A cosmetic edit here fails that test;
      # that is the price of a machine-readable claim, and it is paid on purpose.
      #
      # 🔴 AND SO IS EVERY `control — …` AND `PROVE …` STEP — for the same reason
      # and after a measurement: three of them were pinned by NOTHING, and mutants
      # that re-aimed the Go proof at the Python package, deleted either pod's
      # `/data` emptiness check, and turned a refusal's `exit 1` into `exit 0`
      # each SURVIVED a fully green suite. Reformatting any of them now fails a
      # test.
      # ⚠ NO COUNTS HERE, DELIBERATELY. This said FOUR of each and "those eight
      # steps" while SIX of each existed — the UI leg made it stale and nothing
      # went red. The pinned dicts in `tests/test_publish_workflow.py` ARE the
      # count; a number restated beside them is one more thing to forget. It also
      # said the push steps were "BELOW", which the Go-first reordering made false
      # for the Go pair that now runs above this comment.
      - name: push the Python pod's immutable sha tag
        run: |
          set -euo pipefail
          "${{ steps.skopeo.outputs.bin }}" copy --all \
            "docker-archive:${{ steps.build.outputs.archive }}" \
            "docker://${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.sha_tag }}"

      - name: push the Python pod's version tag, on a tag push only
        if: steps.ref.outputs.version_tag != ''
        run: |
          set -euo pipefail
          "${{ steps.skopeo.outputs.bin }}" copy --all \
            "docker-archive:${{ steps.build.outputs.archive }}" \
            "docker://${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.version_tag }}"

      # 🔴 THE ONLY CHECK THAT ANSWERS THE QUESTION THIS WORKFLOW EXISTS FOR, AND
      # A GREEN PUSH DOES NOT ANSWER IT. A ghcr package is PRIVATE on first
      # publish. A private image and a working one are indistinguishable from
      # inside this job — the push succeeded either way — and the difference only
      # surfaces as `ImagePullBackOff` in somebody else's cluster, hours later,
      # with nothing pointing back here.
      #
      # `--no-creds` is the point: it is the same read an unauthenticated cluster
      # makes. The run is still logged in from two steps ago, so without that flag
      # this would pass on THIS job's credentials and prove nothing at all.
      #
      # 🔴 AND THE `ref` IS PER-PACKAGE, WHICH NOTHING USED TO SAY. The absent-tag
      # control below is COUNTED one per package; the reference that must RESOLVE
      # is reached through `$ref`, one indirection away, and was constrained by
      # nothing. MEASURED: aiming the GO step's `ref` at this package left the
      # suite green while the job pushed the Go image and then printed
      # `ANONYMOUS PULL OK` for `cairn-store`.
      # `test_each_anonymous_proof_inspects_ITS_OWN_package` now pins each proof
      # step's `ref`, forbids the other package's expression anywhere in the
      # step, and requires the printed settings URL to name this step's package.
      - name: PROVE the published image is pullable with NO credentials
        run: |
          set -euo pipefail
          ref='${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.sha_tag }}'
          skopeo='${{ steps.skopeo.outputs.bin }}'

          # The negative control FIRST, so a pass below is a measurement rather
          # than a claim: if an inspect of a tag that cannot exist also succeeds,
          # this instrument is answering something other than the question.
          set +e
          $skopeo inspect --no-creds \
            "docker://${{ steps.ref.outputs.image }}:sha-0000000000000000000000000000000000000000" \
            >/dev/null 2>&1
          control_rc=$?
          set -e
          if [ "$control_rc" -eq 0 ]; then
            echo "REFUSING: an anonymous inspect of a tag that does not exist SUCCEEDED."
            echo "  This check cannot distinguish a public image from anything."
            exit 1
          fi
          echo "negative control: absent tag refused anonymously (rc=$control_rc) — OK"

          set +e
          out=$($skopeo inspect --no-creds "docker://$ref" 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "$out"
            echo
            echo "REFUSING: $ref was PUSHED but cannot be pulled without credentials."
            echo "  A package created by Actions in a PUBLIC repo has been measured to"
            echo "  come out PUBLIC, so this is NOT the expected first-publish state --"
            echo "  something made this one private. GitHub exposes no REST route for"
            echo "  the flip; it is a ONE-TIME manual step, per package:"
            echo
            echo "    https://github.com/users/${{ github.repository_owner }}/packages/container/cairn-store/settings"
            echo "    -> Danger Zone -> Change visibility -> Public"
            echo
            echo "  Until then no cluster outside this repository can pull this image,"
            echo "  which is the entire reason this workflow exists."
            exit 1
          fi
          echo "$out" | head -20
          digest=$(printf '%s' "$out" | sed -n 's/.*"Digest": "\([^"]*\)".*/\1/p' | head -1)
          echo
          echo "ANONYMOUS PULL OK: $ref"
          echo "digest: $digest"
          echo "pin this in a deployment: $ref"

      # ── THE BROWSER SURFACE. Build, controls, both pushes and its own
      # anonymous-pull proof, AFTER both pods for the reason the Python/Go split
      # already records: a leg that fails must not leave an earlier one half-published.
      #
      # 🔴 IT IS NOT A POD AND ITS CONTROLS ARE NOT THE PODS'. A copy of the Go pod's
      # control would assert a route ledger this binary does not have — `cairn-ui`
      # registers no `-routes` flag — so a transplanted control fails for the wrong
      # reason or gets edited until it passes. What transfers is the SHAPE: make the
      # binary REFUSE BY NAME to prove it is really in there, and assert the one path
      # this image has that no pod does.
      - name: build the UI image from the flake
        id: build-ui
        run: |
          set -euo pipefail
          out=$(nix build .#packages.x86_64-linux.ui-image \
                  --no-link --print-out-paths --print-build-logs)
          printf 'archive=%s\n' "$out" >> "$GITHUB_OUTPUT"
          echo "archive = $out"
          ls -l "$out"

      # 🔴 TWO CONTROLS, NEITHER A COPY.
      #   * THE SESSION DIRECTORY IS OWNED BY THE RUN UID — the one thing this image
      #     has that no pod does. `checks.ui-image-owns-its-session-dir` asserts it at
      #     BUILD time from the layer headers; this reads it out of a RUNNING
      #     container, which is a different instrument on the same property and the
      #     one that would notice a base image whose own `/var` shadowed it.
      #   * THE IMAGE RUNS AND REFUSES BY NAME — with no token source it exits
      #     non-zero and prints its own `cairn-ui:` prefix. A container that started
      #     and served instead is the failure `server/README.md` records: an image
      #     that passed health checks while every documented operation against it
      #     failed.
      - name: control — the UI image owns its session dir, runs, and refuses by name
        run: |
          set -euo pipefail
          archive="${{ steps.build-ui.outputs.archive }}"
          ref=$(docker load -i "$archive" | sed -n 's/^Loaded image: //p' | head -1)
          if [ -z "$ref" ]; then
            echo "REFUSING TO PUBLISH: docker load named no image."
            exit 1
          fi
          echo "loaded $ref"

          want_uid=$(docker image inspect "$ref" --format '{{.Config.User}}' | cut -d: -f1)
          if [ -z "$want_uid" ] || [ "$want_uid" = "0" ]; then
            echo "REFUSING TO PUBLISH: the image declares User '$want_uid'."
            echo "  A browser surface holding a live session table must not run as root."
            exit 1
          fi
          owner=$(docker run --rm --entrypoint /bin/busybox "$ref" stat -c '%u' /var/lib/cairn-ui)
          if [ "$owner" != "$want_uid" ]; then
            echo "REFUSING TO PUBLISH: /var/lib/cairn-ui is owned by $owner, not $want_uid."
            echo "  The session table cannot be written, so the surface refuses to start (78)."
            exit 1
          fi
          echo "control: /var/lib/cairn-ui is owned by $owner, and User is $want_uid — OK"

          set +e
          out=$(docker run --rm "$ref" 2>&1)
          code=$?
          set -e
          echo "$out" | head -20
          if [ "$code" -eq 0 ]; then
            echo "REFUSING TO PUBLISH: the UI image exited 0 with no configuration."
            echo "  It must refuse: a surface that comes up misconfigured looks healthy."
            exit 1
          fi
          case "$out" in
            *"cairn-ui:"*) echo "control: the UI image runs and refuses by name — OK" ;;
            *) echo "REFUSING TO PUBLISH: it exited $code without naming itself."
               echo "  Expected a 'cairn-ui:' prefixed refusal; got the above."
               exit 1 ;;
          esac

      - name: push the UI image's immutable sha tag
        run: |
          set -euo pipefail
          "${{ steps.skopeo.outputs.bin }}" copy --all \
            "docker-archive:${{ steps.build-ui.outputs.archive }}" \
            "docker://${{ steps.ref.outputs.image_ui }}:${{ steps.ref.outputs.sha_tag }}"

      - name: push the UI image's version tag, on a tag push only
        if: steps.ref.outputs.version_tag != ''
        run: |
          set -euo pipefail
          "${{ steps.skopeo.outputs.bin }}" copy --all \
            "docker-archive:${{ steps.build-ui.outputs.archive }}" \
            "docker://${{ steps.ref.outputs.image_ui }}:${{ steps.ref.outputs.version_tag }}"

      # 🔴 THIS DOES NOT PREDICT THAT THE FIRST PUBLISH WILL BE PRIVATE, AND THE GO
      # POD IS WHY. That prediction was made for `cairn-store-go` and MEASURED WRONG:
      # Actions created the package PUBLIC and its proof passed first time. So this
      # step measures, and names the one-time remedy only if it actually refuses.
      - name: PROVE the published UI image is pullable with NO credentials
        run: |
          set -euo pipefail
          ref='${{ steps.ref.outputs.image_ui }}:${{ steps.ref.outputs.sha_tag }}'
          skopeo='${{ steps.skopeo.outputs.bin }}'

          set +e
          $skopeo inspect --no-creds \
            "docker://${{ steps.ref.outputs.image_ui }}:sha-0000000000000000000000000000000000000000" \
            >/dev/null 2>&1
          control_rc=$?
          set -e
          if [ "$control_rc" -eq 0 ]; then
            echo "REFUSING: an anonymous inspect of a tag that does not exist SUCCEEDED."
            echo "  This check cannot distinguish a public image from anything."
            exit 1
          fi
          echo "negative control: absent tag refused anonymously (rc=$control_rc) — OK"

          set +e
          out=$($skopeo inspect --no-creds "docker://$ref" 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "$out"
            echo
            echo "REFUSING: $ref was PUSHED but cannot be pulled without credentials."
            echo
            echo "  If this is the FIRST publish of this package it may have been"
            echo "  created private. GitHub exposes no REST route for the flip, so"
            echo "  this URL is the whole remedy:"
            echo "    https://github.com/users/${{ github.repository_owner }}/packages/container/cairn-ui/settings"
            echo "    -> Danger Zone -> Change visibility -> Public"
            exit 1
          fi
          echo "$out" | head -20
          digest=$(printf '%s' "$out" | sed -n 's/.*"Digest": "\([^"]*\)".*/\1/p' | head -1)
          echo
          echo "ANONYMOUS PULL OK: $ref"
          echo "digest: $digest"
          echo "pin this in a deployment: $ref"
