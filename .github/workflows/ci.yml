name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  # 🔴 A SEPARATE JOB, AND DELIBERATELY FIRST. This repository is public and was
  # extracted from a private one; the leak gate is the reason it can be public at
  # all. Keeping it out of the test job means a test failure can never mask it,
  # and its verdict is readable on its own in the checks list.
  leakscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The controls run inside the scan too, but running them as their own step
      # means a broken gate is distinguishable from a dirty tree at a glance.
      - name: prove the gate is an instrument (both controls)
        run: python3 tests/leakscan.py --self-test

      - name: scan the tree
        run: python3 tests/leakscan.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: python3 -m pip install --upgrade pip pytest

      # 🔴 THE PUBLISH WORKFLOW'S GUARDS, PROVED TO GO RED BEFORE THE SUITE IS
      # BELIEVED. `tests/test_publish_workflow.py` pins properties of
      # `.github/workflows/publish-image.yml` that no green run can show — that
      # no pull-request event reaches a job holding `packages: write`, that every
      # published tag is immutable, that the anonymous-pull check is actually
      # anonymous, that BOTH pods are pushed and each carries its OWN controls,
      # that the whole PYTHON half runs before the first GO step, and that the
      # `nix build` resolving skopeo names an OUTPUT rather than the bare
      # multi-output attribute whose `-man` path prints FIRST (which is what made
      # every run of this workflow exit 127) — and it pins them with regular
      # expressions and whole-string equality over a file whose
      # own comments contain every string those expressions look for. That is the
      # easiest kind of guard to write so that it can never fail, and one of them
      # WAS: the `fetch-depth` guard matched the sentence explaining the setting
      # rather than the setting, and survived a mutant that flipped the real
      # value — and a later blind audit found four more, every one of them
      # measured SURVIVED against a fully green suite: the Go anonymous-pull
      # proof re-aimed at the PYTHON package, the `/data`-is-empty control
      # deleted from EITHER pod, and a refusal whose `exit 1` became `exit 0`
      # while both its words survived. The four control steps are now pinned by
      # their whole normalised command text, the way the four push steps are.
      #
      # 🔴 THE COUNT ON THE STEP NAME IS PINNED TO `MUTANTS` BY
      # `tests/test_control_mutant_count_is_pinned.py`. The authz battery's
      # number went stale twice in this same file, once in a step NAME — which
      # is the copy a reader sees in the Actions UI — so this one is not left to
      # prose. 22 mutants, each required to be killed by the test that NAMES its
      # property; a kill by any other test is reported MISATTRIBUTED. It runs
      # BEFORE the suite because a suite green over an inert guard is the thing
      # it exists to rule out, and it takes about six seconds.
      - name: prove every publish-workflow guard can go RED (22 mutants)
        run: python3 tests/publish_workflow_mutants.py

      # 🔴 READ THE COLLECTED COUNT, NOT JUST THE EXIT CODE. pytest can collect
      # ZERO tests and exit 0 — an empty suite is indistinguishable from a green
      # one if you only look at the status. The floor makes that impossible.
      #
      # 🔴 AND A FLOOR FAR BELOW THE SUITE IS THE SAME BLINDNESS ONE STEP UP. At
      # 200 against a suite of 1698 it could not see a collection narrowing to
      # 300 — 82% of the suite gone, silently — which is the exact failure the
      # paragraph above says it prevents. The floor is `m - min(50, max(1, m/20))`
      # for a measured `m`: close enough that a real narrowing cannot hide under
      # it, loose enough that removing a handful of tests in a PR does not turn
      # this into a permanently-red gate nobody reads.
      #
      # ⚠ THIS IS AN INVARIANT GUARD, NOT REGRESSION COVERAGE. No bug ever
      # narrowed this suite; it pins a property so that one cannot pass unseen.
      - name: run the suite with a collected-test floor
        run: |
          set -o pipefail
          python3 -m pytest tests -q -p no:randomly --junitxml=/tmp/r.xml | tee /tmp/out.txt
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          # 1856 collected, measured on the server dual-run branch: 1839 plus the seventeen
          # in `test_dualrun_harness.py` — the ledger over `tests/dualrun/`, which pins the
          # gate's route coverage against the oracle's own dispatch tables, its parameter
          # coverage at two or more values each, its declared licences, its target-id
          # uniqueness, that the write phase addresses a SUCCESS on both halves of the PUT,
          # that its three modules are not the identically-named parity ones, and its seven
          # negative controls. ⚠ The Go-side regression test added
          # in the same change (`api.TestTheAuditRecordIsTheORACLESSPELLING…`) is NOT in this
          # number: it is a different runner in a different job.
          #
          # 1839 was measured after the AGENTS.md weight work: 1832 on the P2
          # branch plus the six in `test_agent_instructions_weight.py` (the byte ceiling
          # on the instructions every session loads) and the one added to
          # `test_go_client_ledgers.py` (the Go-ONLY ledger-flag set, residual 7's gate).
          # `test_parity_harness.py` is net zero there: its stale self-reported-count test
          # was rewritten rather than added to or deleted.
          # 🔴 1923 MEASURED ON THE MULTI-INSTANCE BRANCH: 1860 at `0497140` plus 63 —
          # SIXTY-TWO in `test_cairn_instances.py` and ONE in
          # `test_subsystem_read_store.py`. The line here used to read "the sixty in
          # `test_cairn_instances.py`" against a file that collected fifty-nine, and it
          # omitted the second file entirely: a self-reported per-file count goes stale
          # in the direction that makes the floor look explained. Re-derive it:
          #   python3 -m pytest tests -p no:randomly --collect-only -q | grep :: \
          #     | sed 's/\[.*//' | awk -F:: '{print $1}' | sort | uniq -c
          #
          # 🔴 AND A COUNT IS NOT A LEDGER — DIFF THE NAMES, NOT THE TOTAL. This floor is
          # structurally blind to a change that deletes two tests and adds three, which
          # is exactly what happened while this branch was being written: a scripted edit
          # swallowed `test_the_CLI_grades_the_table_and_exits_NONZERO_on_a_missing_entry`
          # and `test_a_CORRECT_table_passes_the_CLI_check` along with the test it meant
          # to replace, and the total still cleared the floor by 50. Before raising this
          # number, collect the NAMES on the base ref and on HEAD (one worktree each, so
          # the two listings are of different trees) and require every removal to be a
          # rename you can point at:
          #   python3 -m pytest tests -p no:randomly --collect-only -q | grep :: \
          #     | sed 's/\[.*//' | sort > names-<ref>.txt
          #   comm -23 names-base.txt names-head.txt    # removed — must all be renames
          #   comm -13 names-base.txt names-head.txt    # added
          # Measured that way for THIS change: base 1860, head 1924, 64 added, 0 removed.
          # The 64th arrived in the round-2 audit fixes: the dotted-file skip's OTHER arm
          # (`instances/.env` must still REFUSE), which the skip-arm test alone left open.
          # Re-measured at that point rather than carried forward — a self-reported count
          # goes stale in the direction that makes the floor look explained.
          #
          # 1832 was the P2 branch: 1819 at `1e593a8` plus the ten in
          # `test_parity_harness.py` (the coverage ledger over the parity gate's own case
          # list) and the three then in `test_go_client_ledgers.py`. Before that, 1769
          # against 1819 measured on the P1b branch.
          #
          # ⚠ THE FOUR LEDGER TESTS IN `test_go_client_ledgers.py` COUNT TOWARD THIS NUMBER
          # WHETHER THEY RUN OR SKIP — pytest counts a skip as collected — so the floor is the
          # same either way. Whether they actually skip HERE depends on whether the runner
          # image ships a `go` toolchain, which this repository does not control and which is
          # therefore NOT asserted: the `go` job runs that file explicitly and REFUSES on a
          # skip, which is where the claim belongs. A skip nobody counts is indistinguishable
          # from a pass.
          #
          # 1860 was measured after the name/date scrub: 1856 plus the four in
          # `test_leakscan_covers_every_tracked_file.py` that gate the two rules
          # `leakscan.py` grew for the two AGENTS.md bullets that had no gate — the
          # denied-identifier DIGEST SET's size (it can only be un-gated by deleting a
          # digest, and nothing else would notice), `self_test()`'s verdict read in THIS
          # tier as well as the `leakscan` job's, an end-to-end refusal proving both new
          # rules are reachable through `main()` and not merely through `scan_text`, and
          # the one that pins the DOCUMENTED matching examples as behaviour. That last
          # one exists because the digests cannot be read, so the comment above them is
          # the only documentation of the matching rule and a wrong example there is
          # worse than none.
          #
          # Raise as the suite grows — `m - min(50, max(1, m/20))` for the m you
          # measured; never lower without saying why. ⚠ THE GO TESTS ARE NOT IN
          # THIS NUMBER: they are a different runner in a different job, and
          # folding them in would make one floor answer two questions. Nor is the
          # PARITY gate: it is its own job with its own floor, for the same reason.
          # 🔴 1938 MEASURED ON THE PUBLISH-IMAGE BRANCH: 1927 at `83c6ba4` plus the
          # ELEVEN in `test_publish_workflow.py` — the guards over
          # `.github/workflows/publish-image.yml` (the trigger-set equality that keeps
          # a pull request away from `packages: write`, the two-member immutable-tag
          # ledger, the `--no-creds` requirement on every anonymous-pull check, the
          # full-sha tag, the negative control, the non-shallow checkout, the
          # no-third-build-path rule) plus the three controls that make those
          # measurements rather than claims: the extractors find something, they can
          # SEE a planted hazard, and an empty file does not read as agreement.
          #
          # Measured with names on the base ref and on HEAD, one collect-only run each:
          # base 1997, head 2037, 55 added, 15 removed. The base ref is whatever
          # `git merge-base origin/main HEAD` prints — DELIBERATELY NOT SPELLED AS A SHA
          # HERE; see the re-take note below for why. The FLOOR itself derives from the HEAD
          # count alone; the base count is here only so the +55/-15 has something to be a
          # delta FROM, which is why it can lose its sha without losing its meaning.
          #
          # 🔴 ON FULL NODE IDS, NOT ON THE RECIPE ABOVE AS WRITTEN, AND THE DIFFERENCE IS
          # THE WHOLE 15. That recipe's `sed 's/\[.*//'` STRIPS PARAMETRISE IDS; ten of the
          # fifteen removals are `TestNonFiniteLimiterSettings` id renames, which are
          # exactly the rows `sed` deletes. Run verbatim it yields **5 removed / 45 added**
          # — measured, at both bases. So `55/15` comes from the same pipeline with the
          # `sed` dropped:
          #   python3 -m pytest tests -p no:randomly --collect-only -q | grep :: \
          #     | sort > names-<ref>.txt
          # A sentence claiming to follow the recipe while quoting the other form's numbers
          # is what this replaces. The `sed` line is left as it is on purpose: collapsing
          # ids is the right form for "did a test FILE disappear", and the wrong one for a
          # change that renames parameters — say which you ran.
          #
          # 🔴 THE MERGE-BASE SHA IS NOT NAMED ABOVE, AND THAT IS THE FIX RATHER THAN AN
          # OMISSION: NAMING IT WENT STALE THREE TIMES, TWICE INSIDE THE COMMIT RANGE THAT
          # RE-STATED IT. The sentence read "base 1994 at the merge-base `080bb2d`", then
          # "`080bb2d` is no longer the merge-base; `c5df961` is", then "`1659663` is" —
          # and each time the next merge of `origin/main` into this branch moved it again.
          # `git log --merges --oneline origin/main..HEAD` counts FOUR such merges; a sha
          # pinned here is stale on the fifth, by construction and not by carelessness. So
          # the rule instead of the number: **the base ref for this measurement is whatever
          # `git merge-base origin/main HEAD` prints at the moment you take it** — one
          # command, re-derivable by anyone, and it cannot rot.
          #
          # ⚠ RE-TAKEN THREE TIMES AND THE COUNT NEVER MOVED, WHICH IS WHY ONLY THE SHA WAS
          # EVER THE PROBLEM. `c5df961`, `1659663` and the base current at this commit each
          # collect **1997** (#64/#71/#72 added no Python tests); re-measured from scratch at
          # the last of those — 1997 base / 2037 head / +55 / -15, the same pipeline below —
          # so 55/15 has held across every move. Those three shas are HISTORY and are
          # correct as history; the line above is the only present-tense claim, and it names
          # a command rather than a commit.
          # The earlier move, 1994 -> 1997, was reported as +3/-0
          # (`test_cairn_cli.py::TestInterpretersWithoutTarExtractionFilters`); that half is
          # CARRIED FORWARD from the previous re-take and was not re-measured here, which is
          # said rather than dropped because `080bb2d` is no longer an interesting base.
          #
          # 🔴 "15 REMOVED" IS THE NUMBER THIS COMMENT EXISTS TO MAKE SOMEBODY EXPLAIN, SO
          # HERE IS THE EXPLANATION, RE-DERIVED AT EACH BASE RATHER THAN CARRIED FORWARD,
          # AND IT IS NOT "TESTS WERE DELETED". The removed and added SETS are byte-identical
          # at `c5df961`, at `1659663` and at the base current at this commit — checked each
          # time, not assumed, which is what lets the base ref move without this breakdown
          # moving. The 15 re-collected as ten `TestNonFiniteLimiterSettings` ids, the three
          # renames and the two deletions enumerated below, member for member.
          #
          # TEN are `TestNonFiniteLimiterSettings` PARAMETRISE IDS that changed spelling
          # with the rename — `[SUBSYSTEM_STORE_LOCKOUT_S-nan]` became
          # `[CAIRN_LOCKOUT_S-nan]`, two variables × five non-finite values; the class
          # collects 11 cases at both ends.
          #
          # THREE are guards RENAMED with the assertion re-aimed, one new name each:
          #   `…go_image_runtime_contract.py::test_the_computed_go_env_is_not_empty`
          #     -> `…::test_the_computed_go_env_parses_and_is_now_LEGITIMATELY_empty`
          #   `…go_image_runtime_contract.py::test_the_exposed_port_derives_from_serverPort_and_matches_the_env`
          #     -> `…::test_the_exposed_port_derives_from_serverPort_and_matches_what_the_server_binds`
          #   `…image_matches_dockerfile.py::test_the_exposed_port_agrees_with_the_env_the_server_actually_reads`
          #     -> `…::test_the_exposed_port_agrees_with_the_port_the_server_actually_binds`
          # Each lost its operand when the images stopped setting the three store
          # variables, so each now reads the CODE default instead of the image `ENV`.
          #
          # TWO are DELETED outright, and both had to be:
          #   `…::test_the_go_env_carries_the_deployment_contract_with_the_python_values`
          #     asserted the Go pod's env CONTAINS the three `SUBSYSTEM_STORE_*` names,
          #     which is now false by design — it would fail on a correct tree.
          #   `…::test_the_removal_list_drops_NOTHING_the_deployment_names`
          #     asserted `serverEnvPythonOnly` omits them; the names are not in
          #     `serverEnv` at all any more, so it could never fail again — an invariant
          #     guard reading as coverage.
          # `test_NEITHER_image_sets_a_variable_the_resolver_would_read` is what stands in
          # their place, over BOTH columns of the rename ledger.
          #
          # A name diff cannot tell a rename from a deletion — so the rule is that whoever
          # moves this line reads the removed set and says which each one is, rather than
          # quoting the count.
          #
          # ⚠ THAT LINE READ "base 1972 … 20 added" AND WAS WRONG, IN THE ONE SENTENCE
          # WHOSE ENTIRE PURPOSE IS A BASE-VS-HEAD COMPARISON. 1972 was carried over
          # from an earlier PR's measurement, so "0 removed" was asserted against a
          # base three PRs stale. Then it read "base 1989, head 1994" — a measurement of
          # the PR BEFORE this one, left in place while this branch added tests, which is
          # the same staleness one PR later.
          #
          # ⚠ IT WAS 1888 AGAINST A SUITE OF 1989 — 101 tests could have vanished
          # silently, the second blindness the paragraph above names. It went stale the
          # ordinary way: every PR that adds tests and does not move this line widens
          # the gap, and nothing red. Re-derived from `m - min(50, max(1, m/20))`.
          #
          # 1987 = 2037 - min(50, max(1, 2037/20)), the formula above, for the m measured
          # on this branch.
          FLOOR = 1987
          t = ET.parse("/tmp/r.xml").getroot()
          suites = [t] if t.tag == "testsuite" else list(t)
          ran = sum(int(s.get("tests", 0)) for s in suites)
          fail = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          print(f"collected={ran} failed={fail} floor={FLOOR}")
          if ran < FLOOR:
              print(f"REFUSING: collected {ran} < floor {FLOOR} — the suite silently narrowed")
              sys.exit(1)

          # 🔴 AND THE DRIFT GUARD, WHICH A PREVIOUS COMMENT HERE SAID WAS IMPOSSIBLE.
          # It claimed a guard would need "a step reading its own job's output, which is
          # a different instrument" — this IS that step, and `ran` IS the `m` the formula
          # takes. The claim was false about the file it was written in; the two lines it
          # said could not be spent are below.
          #
          # ⚠ THE BOUND IS 2x THE FORMULA'S OWN MAXIMUM GAP, NOT THE FORMULA ITSELF, AND
          # THE LOOSENING IS DELIBERATE. `tests/test_parity_harness.py`'s equivalent guard
          # IS exact, and the difference is how often each `m` moves: a parity CASE is
          # added a few times a year, so demanding the literal move with it costs nothing,
          # while the collected count moves on most PRs — an exact guard here would red
          # every test-adding PR until somebody edited a number, which is how a gate gets
          # rubber-stamped. What actually failed historically was GROSS drift (a gap of
          # 101), not a one-test lag, so that is what this catches.
          MAX_GAP = 2 * 50
          if ran - FLOOR > MAX_GAP:
              print(
                  f"REFUSING: the floor is {FLOOR} against {ran} collected, a gap of "
                  f"{ran - FLOOR} — more than {MAX_GAP}, so it has drifted far enough to "
                  f"hide a real narrowing. Re-derive it: m - min(50, max(1, m/20)) = "
                  f"{int(ran - min(50, max(1, ran / 20)))}."
              )
              sys.exit(1)
          sys.exit(1 if fail else 0)
          PY

  # 🔴 THE GO PORT'S OWN GATE, AND IT IS A SEPARATE JOB FOR THE SAME REASON THE
  # LEAK SCAN IS: its verdict is readable on its own in the checks list, and a
  # Python failure can never mask it or the other way round.
  #
  # 🔴 THE TOOLCHAIN IS PINNED, NOT INHERITED. 1.25 is what `go.mod` declares and
  # what `flake.nix` builds with (`buildGo125Module` — nixpkgs' default `go` is
  # 1.26 against the pinned lock). Move all three together or not at all; the
  # same discipline the Python 3.12 pin is under, and for the same reason.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      # 🔴 THE CONFORMANCE RUNNER IS PYTHON, AND IT IS PINNED HERE FOR THE SAME REASON
      # IT IS PINNED IN THE `tests` JOB. `run_go.sh` materialises the fixture world and
      # replays the corpus with `tests/conformance/suite.py`; letting that run on
      # whatever interpreter the runner image happens to ship would measure the Go
      # server with a tool nothing else in this repo has ever used.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 🔴 THERE IS NO `go mod verify` STEP HERE, AND THE ABSENCE IS A MEASUREMENT
      # RATHER THAN AN OVERSIGHT — a draft of this job ran one, right here, and it
      # verified the EMPTY SET. `cache: false` above means this job starts with no
      # module cache, `go mod verify` does not download, and it stood AHEAD of the
      # `go vet` step below — so it ran against a cache nothing had yet populated and
      # printed the identical success line over zero modules. Measured on go1.26.7
      # against isolated `GOMODCACHE`s, `rc` captured before any pipe:
      #
      #     cold (this job's state)              rc 0  `all modules verified`  0 modules in cache
      #     populated                            rc 0  `all modules verified`  1 module  in cache
      #     populated + a line appended in       rc 1  `maragu.dev/gomponents v1.3.0:
      #       the module directory                     dir has been modified`
      #
      # 🔴 AND MOVING IT BELOW `go test` WOULD NOT HAVE RESCUED IT. The only thing
      # it can catch is a module cache modified AFTER its fetch. This job fetches
      # into a cache no earlier step restored and nothing between the fetch and the
      # check writes to it, so the window it guards does not exist here — the step
      # would be green-by-construction in its new position too, which is the gate
      # nobody can fail that this repository refuses to keep.
      #
      # 🔴 IT ALSO NEVER GATED THE HAZARD ITS NAME SUGGESTS. With `go.sum`'s `h1:`
      # line corrupted it exits **0** with `all modules verified` in BOTH cache
      # states — it compares the extracted directory against the hash the cache
      # itself recorded at download time, never against `go.sum`. What refuses that
      # tree is the BUILD, which the `go vet` and `go test` steps below already run:
      # rc 1, `verifying maragu.dev/gomponents@v1.3.0: checksum mismatch` followed by
      # `SECURITY ERROR / This download does NOT match an earlier download recorded
      # in go.sum` — measured with `go build ./...` over an isolated cache. Whether a
      # nix build refuses the same tree with the same words is NOT measured here; the
      # claim above is scoped to the toolchain this job runs.

      # 🔴 `vet` BEFORE `test`, and both before the corpus. Each is a different
      # question: vet reads the code, the unit tests exercise the guards, and the
      # conformance corpus measures the SERVED behaviour against the oracle's
      # recorded contract. A green on any one of them is not the others.
      - name: go vet
        run: go vet ./...

      # 🔴 READ THE PER-PACKAGE RESULT LINES, NOT JUST THE EXIT CODE. `go test`
      # over a module with no test files exits 0 — and that is not hypothetical
      # here: the flake's own check phase was measured running ZERO tests while
      # reporting green, because a `subPackages` narrowing had scoped the test
      # walk to the one directory that has none. The floor makes that impossible.
      #
      # 🔴 AND `-race` IS ON THE SAME INVOCATION RATHER THAN A SECOND STEP, SO THE `ok`
      # FLOOR BELOW COVERS THE RUN THAT ACTUALLY HAPPENED. A separate race step would
      # leave the floor enforced on the plain run and the race run ungated — a test walk
      # that narrowed under `-race` would then report nothing. Measured cost on one
      # machine, cold build cache (which is what this job has: `cache: false` above):
      # 14 s plain -> 22 s with `-race`, 15 `ok` lines either way, zero races. The
      # detector needs cgo and a C toolchain — measured: `CGO_ENABLED=0 go test -race`
      # refuses with "go: -race requires cgo". `ubuntu-latest` (Ubuntu 24.04) carries
      # `gcc`, `g++`, `make` and `binutils` as VITAL apt packages in the runner-images
      # manifest, and `actions/setup-go` neither sets nor unsets `CGO_ENABLED`, so Go's
      # default of 1 applies. ⚠ That half is read from those manifests rather than from a
      # run on a runner; the first green run of this step is what settles it.
      #
      # ⚠ AND IT ESTABLISHES FAR LESS THAN "THE CONCURRENCY IS CORRECT". `-race` detects
      # a DATA race, and only on an interleaving some test actually produces. It is green
      # on a LOGICAL race — `internal/control/cache_test.go` carries one it cannot see,
      # two refreshes perfectly synchronised and committing in the wrong order.
      - name: go test, under `-race`, with an `ok` floor
        run: |
          set -o pipefail
          go test -race ./... | tee /tmp/go-test.txt
          ok=$(grep -c '^ok  ' /tmp/go-test.txt || true)
          # NINETEEN packages carry tests, measured on the MERGED tree: api, authz, client,
          # cmd/cairn-server, cmd/cairn-ui, control, control/tokenfile, depspolicy, doctor,
          # envalias, hostid, identity, netid, pytext, report, snapshot, store, ui, write.
          # 🔴 NINETEEN IS A MERGE RESULT, AND NEITHER SIDE COULD SEE IT. Two branches each
          # added ONE package and each measured EIGHTEEN correctly for its own tree —
          # `cmd/cairn-ui` with the share flow, `envalias` with the `CAIRN_*` ledger. Taking
          # either side's number wholesale puts the floor one BELOW the merged count, which
          # is the free-deletion defect this comment already documents twice. The count was
          # re-measured on the merged tree rather than computed from either side. It was
          # NINE at P1b; `client` and
          # `doctor` arrived with the Go CLIENT, `control` with P3a, `control/tokenfile`
          # with the control-plane wiring, `cmd/cairn-server` with the gate on the
          # authority refresh loop — which is the only thing bounding the token-file
          # adapter's declared divergence and had no test of any kind before it — and
          # `identity` with P4's authenticator interface and its two new backends, and
          # `depspolicy` + `ui` with the web UI's phase A — `depspolicy` is the module
          # allowlist and the import ban that replaced `vendorHash = null`, `ui` is the
          # renderer, its escaping guard and its raw-node ban. TWO packages arrived last and
          # independently: `cmd/cairn-ui`, with the share flow's startup refusals — the
          # control-journal guard, whose first two spellings were each walked around by a
          # state nobody had tested — and `envalias`, with the `SUBSYSTEM_STORE_*` → `CAIRN_*`
          # ledger, the resolver and the whitespace-blank regression arm. Measured at 19 over
          # the package set `./...` of module `github.com/ZacxDev/cairn` on a developer host,
          # on the merged tree, with both of those present in the `ok` list.
          # ⚠ THE NIX CHECK PHASES ARE NOT RE-MEASURED AT NINETEEN. They run the same walk and
          # were last read at 18 (`nix log` for both `cairn-server` and `cairn-go`, before
          # `cmd/cairn-ui` carried tests) and at 17 before that. Read those as a RECORD of the
          # tree they were taken on, never as a current reading — re-spelling a number is not
          # re-measuring it.
          #
          # 🔴 THE FLOOR IS THE COUNT ITSELF — **NOT** ONE BELOW IT, AND THE ARITHMETIC IS
          # WRITTEN OUT HERE RATHER THAN ASSERTED AS A PROPERTY, BECAUSE THE PROPERTY WAS
          # ASSERTED AND WAS FALSE. This comment used to read "the floor is ONE BELOW that,
          # so deleting a package's tests fails here" while the test was `-lt 16` against
          # seventeen packages. Deleting one package's tests gives 16, and 16 is not
          # `< 16` — measured: with `internal/depspolicy`'s tests removed, `ok=16` and the
          # old condition PASSED. A floor one below the count buys exactly one free
          # deletion, which is the only deletion anybody would make. The same defect was in
          # the pair this branch inherited (fifteen packages, `-lt 14`), so it is carried
          # forward rather than introduced here.
          #
          # 🔴 AND IT REGENERATED ON THIS VERY BRANCH, WHICH IS WHY THE "MOVE IT" LINE BELOW
          # IS NOT ENOUGH ON ITS OWN. `internal/envalias` was added here and the floor was
          # left at 17, so the arithmetic was back to one-below-the-count and the free
          # deletion was `internal/envalias/envalias_test.go` — the very file this branch
          # exists to add. Measured on the PRE-MERGE branch, where the module had eighteen
          # test packages: unmutated `ok=18`; with that file removed `ok=17`, and
          # `17 -lt 17` is FALSE, so the old gate reported success while the branch's own
          # regression arm was gone. ⚠ Those two numbers are a RECORD of that tree, not of
          # this one — the merge with the share flow made the count nineteen. Adding a
          # package and not moving this number does not fail late — it stops failing at all.
          #
          # So: `ok < 19` refuses. 19 passes (the merged tree, measured). 18 refuses (one
          # package's tests gone). 20 passes (a package ADDED), which is the other half of
          # the property and the reason this is a floor rather than an equality. 🔴 THE THREE
          # NUMBERS IN THIS SENTENCE AND THE LEDGER ABOVE MOVE TOGETHER WITH THE CONDITION,
          # IN ONE COMMIT — an audit round caught the commit that moved the condition to 18
          # leaving all of them at 17, including this sentence saying in bold that 17 passes.
          # A maintainer whose deletion failed the gate would have read that, concluded the
          # gate was misconfigured, and set it back — restoring the exact off-by-one this
          # block was written about. 🔴 AND THE NUMBERS MOVE ON A MERGE TOO, NOT ONLY ON AN
          # EDIT: two branches each adding one package each measured 18 CORRECTLY for their
          # own tree, and 18 is one BELOW the merged count. Re-measure on the merged tree;
          # neither side's number is the answer. It is the same shape as the
          # Python collected-test floor, and for the same reason: `go test` over a package
          # with no test files exits 0, so the exit code alone cannot tell a green suite
          # from an absent one.
          #
          # 🔴 MOVE THIS NUMBER WITH THE PACKAGE COUNT, IN THE SAME COMMIT. A floor left
          # behind does not fail late — it stops failing at all, once per package of lag.
          #
          # ⚠ AND IT DEFENDS THE PACKAGE, NOT THE TEST. Deleting one `func Test…` from a
          # file that keeps others leaves `ok` at 19 and this gate green. That gap is
          # stated in `internal/depspolicy`'s package doc, where the guarantee it defends
          # is written down.
          echo "packages with passing tests: $ok"
          if [ "$ok" -lt 19 ]; then
            echo "REFUSING: only $ok package(s) reported ok — the test walk narrowed"
            exit 1
          fi

      # 🔴 THE AUTHORIZATION MATRIX CARRIES ITS OWN POSITIVE CONTROL (32 of 60 cells must
      # ALLOW, pinned from BOTH sides, so a resolver that grants nothing or everything
      # fails) — and that is a claim about the matrix, not about the individual guards
      # around it. This battery is the other half: it breaks each guard on purpose and
      # refuses unless the test that CLAIMS that guard is the one that goes red. A mutant
      # killed by some other test proves the suite can fail and proves nothing about the
      # guard the row exists for, so the run reports it as MISATTRIBUTED rather than as a
      # kill. 150 mutants over SEVEN packages, in `PKGS` order: `internal/control`,
      # `internal/control/tokenfile`, `internal/identity`, `internal/api`,
      # `cmd/cairn-server`, `internal/ui`, `cmd/cairn-ui` — the model, the token-file
      # projection, P4's identity backends, the server that authorises from all of them,
      # the pod's program, the browser surface and the browser surface's program, because a
      # mutant in one is killed by a guard in another, the refresh loop that bounds the
      # adapter's declared divergence exists only in `main`, the share flow is the second
      # consumer of the same authority, and the browser's startup refusals are the only
      # thing between a misconfigured deployment and a surface that serves nobody. That enumeration is pinned to `PKGS` as
      # a whole string by `tests/test_control_mutant_count_is_pinned.py` — membership and
      # order, not just the count, because a swap that kept the count left it stale.
      # Four of the cache rows are killed
      # by a TIMEOUT rather than by an assertion, which is what the bulk of the wall time
      # buys (~3min on an IDLE developer host, measured at 62 mutants; a loaded box is
      # several times that). It is what stops the rows bit-rotting into patterns that
      # match nothing and score SURVIVED without ever running.
      - name: prove every authz guard can go RED (150 mutants, each on the test that names it)
        run: python3 tests/control_mutants.py

      # 🔴 THE LEDGERS THAT ARE BLIND TO A COMPILED CLIENT, AND THIS IS THE ONLY JOB THAT
      # CAN READ THEM. `capability_ledger.cli_verbs_from_parser` asks the PYTHON argparse
      # parser what subcommands it has, and `test_cairn_doctor.py` walks the `cairn`
      # script's AST for its `EXIT_*` constants — neither has an equivalent for a binary.
      # `tests/test_go_client_ledgers.py` reads both out of the RUNNING Go client, so it
      # needs a Go toolchain and SKIPS in the `tests` job. A skip nobody counts is
      # indistinguishable from a pass, which is why it is run explicitly here and why the
      # step refuses on a skip rather than reading the exit code.
      - name: the Go client's own verb and exit-code ledgers
        run: |
          set -o pipefail
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/test_go_client_ledgers.py -q -p no:randomly \
            --junitxml=/tmp/ledgers.xml | tee /tmp/ledgers.txt
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          t = ET.parse("/tmp/ledgers.xml").getroot()
          suites = [t] if t.tag == "testsuite" else list(t)
          ran = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          fail = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          print(f"collected={ran} skipped={skipped} failed={fail}")
          # 🔴 A SKIP HERE IS A REAL HOLE, NOT A DETAIL: these three tests are the ONLY
          # thing that reads the Go client's tables, so a skipped one leaves the capability
          # gate and the shared-exit-code ledger green over an unmeasured binary.
          if skipped:
              print("REFUSING: a ledger test SKIPPED in the one job that can run it")
              sys.exit(1)
          # FOUR tests in that file now: the verb-set equality, the {0,9} intersection, the
          # cross-client exit-code equality, and — added with the AGENTS.md weight work — the
          # Go-ONLY ledger-flag set, which is the one thing that notices a third `-verbs`-shaped
          # flag arriving. That last one is the gate over residual 7 in tests/parity/README.md, so
          # it is exactly as load-bearing as the other three and belongs under the same floor.
          if ran < 4:
              print(f"REFUSING: collected {ran} < 4 — the ledger file narrowed")
              sys.exit(1)
          sys.exit(1 if fail else 0)
          PY

      # 🔴 THE P1 GATE ITSELF: the conformance corpus, replayed against the Go
      # server. At P1a it was expected to be PARTIAL — the `/recall` and `/search`
      # rendering was P1b's — so this asserted a SPLIT. P1b landed the renderer and
      # the split is gone, so the assertion is now zero failures of every kind.
      #
      # ⚠ THE PASS FLOOR STAYS, AND IT IS NOT REDUNDANT WITH "ZERO FAILURES". A run
      # that collected nothing has zero failures too; the floor is what tells a green
      # corpus from an absent one, which is the same reason the Python job counts
      # collected tests instead of reading an exit code.
      - name: the conformance corpus against the Go server
        run: |
          set -o pipefail
          tests/conformance/run_go.sh > /tmp/conformance.txt 2>&1 || true
          grep '^SUMMARY' /tmp/conformance.txt
          # 🔴 THREE KINDS OF `FAIL ` LINE, COUNTED SEPARATELY, BECAUSE THEY ARE
          # THREE DIFFERENT CLAIMS. `FAIL <case>` is a case whose answer differs
          # from its golden; `FAIL normalization <case>` is a declared licence to
          # differ that matched nothing (which a 501 body necessarily produces for
          # every report row); `FAIL relation <name>` is a between-responses
          # property. A single `grep -c '^FAIL '` folds all three into one number
          # that agrees with any of them — measured: 66, against 22 real case
          # failures.
          passes=$(grep -c '^PASS ' /tmp/conformance.txt || true)
          cases=$(grep '^FAIL ' /tmp/conformance.txt | grep -cvE '^FAIL (normalization|relation) ' || true)
          norms=$(grep -c '^FAIL normalization ' /tmp/conformance.txt || true)
          relations=$(grep -c '^FAIL relation ' /tmp/conformance.txt || true)
          skips=$(grep -c '^SKIP ' /tmp/conformance.txt || true)
          echo "passes=$passes failing-cases=$cases failing-normalizations=$norms failing-relations=$relations skips=$skips"

          # Measured at P1b: 116 PASS lines (cases and relations), 0 failing cases,
          # 0 failing normalizations, 0 failing relations, 5 SKIP lines (4
          # oracle-specific cases plus the one uniform-401 member that belongs to
          # one of them). At P1a it was 94 / 22 / 44 / 0 / 5 — the 22 were every
          # `/recall` and `/search` RENDERING case and the 44 were their two
          # report-body normalizations, which cannot fire on a 501 body.
          #
          # ⚠ THE PREVIOUS VERSION OF THIS STEP ALSO CHECKED THAT EVERY FAILING LINE
          # NAMED A REPORT ROUTE, so a regression could not hide inside the expected
          # partial split. With the ceiling at zero that check is subsumed: there is no
          # allowed failure left for anything to hide among, which is why it is deleted
          # rather than kept as a second spelling of the same refusal.
          if [ "$passes" -lt 116 ]; then
            echo "REFUSING: $passes passes, and 116 were measured at P1b — the run got worse"
            exit 1
          fi
          if [ "$cases" -ne 0 ] || [ "$norms" -ne 0 ] || [ "$relations" -ne 0 ]; then
            echo "REFUSING: $cases failing cases, $norms failing normalizations,"
            echo "          $relations failing relations; P1b measured 0 of each"
            grep '^FAIL ' /tmp/conformance.txt
            exit 1
          fi
          # 🔴 AND THE SKIP SET IS PINNED BY SIZE, BECAUSE A SKIP NOBODY COUNTS IS
          # INDISTINGUISHABLE FROM A PASS. Four rows are `oracle_only` plus the one
          # uniform-401 member belonging to one of them; the mechanism is the one thing
          # in this corpus that is ALLOWED to stop comparing a case, so a fifth
          # oracle-specific row appearing has to be a decision somebody made.
          if [ "$skips" -ne 5 ]; then
            echo "REFUSING: $skips SKIP lines, and 5 were measured — a row stopped being compared"
            grep '^SKIP ' /tmp/conformance.txt
            exit 1
          fi

  # 🔴 THE P2 GATE, AND IT IS ITS OWN JOB FOR THE SAME REASON THE CORPUS IS: its verdict is
  # readable on its own in the checks list, and a failure in either language can never mask it.
  # It needs BOTH runtimes — the Python client is the oracle and the Go client is under test —
  # so it is the one job that pins both pins.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 🔴 THE CONTROLS FIRST, AND BOTH OF THEM, BECAUSE A GREEN FROM THIS HARNESS IS
      # INDISTINGUISHABLE FROM A HARNESS WIRED TO NOTHING UNTIL THEY HAVE BEEN WATCHED TO WORK.
      # That is not cautionary: the first full run of this gate reported 72 PASS / 0 FAIL while
      # every request was refused `401 status=no-client-ip`, no cache was ever written, and every
      # report rendered `store-unreachable`. Two clients failing identically compare equal.
      - name: prove the differ can go RED (stdout, stderr AND the exit code)
        run: python3 tests/parity/harness.py --self-test

      - name: prove the pre-flight REFUSES a pod that cannot answer
        run: |
          set +e
          python3 tests/parity/harness.py --break-pod > /tmp/broken.txt 2>&1
          rc=$?
          set -e
          cat /tmp/broken.txt
          # exit 2 is "could not vouch", which is a DIFFERENT verdict from 1 ("a row differs").
          if [ "$rc" -ne 2 ]; then
            echo "REFUSING: a pod configured to refuse every direct request produced rc=$rc,"
            echo "          not 2. The pre-flight is the only thing standing between this gate"
            echo "          and a green computed over two identical failures."
            exit 1
          fi
          grep -q 'REFUSING TO VOUCH' /tmp/broken.txt

      - name: the parity gate
        run: |
          set -o pipefail
          python3 tests/parity/harness.py | tee /tmp/parity.txt
          passes=$(grep -c '^PASS ' /tmp/parity.txt || true)
          fails=$(grep -c '^FAIL ' /tmp/parity.txt || true)
          echo "passes=$passes failures=$fails"
          # 104 PASS lines measured on this head: 102 cases plus TWO structural checks —
          # `cache-mtime-parity` and `orphan-reap-parity`. 🔴 THE SECOND STRUCTURAL CHECK IS
          # WHY THIS MOVED BY TWO WHILE ONLY ONE CASE LANDED: the reap returns a count no
          # client prints, so it is unreachable from any stdout/stderr/exit row and has to be
          # read off the filesystem. The one new case is
          # `recall-focus-resolved-through-an-explicit-repo-PATH`, which hands `--repo` an
          # ABSOLUTE path — the three focus rows beside it default it to `.`, so no world's
          # glob metacharacter can reach the anchor through them.
          # It was 102 (101 cases) before that, and 91 (90 cases) at `871e6ff`; the eleven rows
          # added between those two are the
          # `routes` verb, which the verb ledger requires a case for, `exit 11`, which the
          # exit-code ledger requires a row to reach, TWO MULTI-INSTANCE rows that stand up
          # a second pod — the shape every other row is blind to by construction, and the one
          # that catches a client reading every instance from the DEFAULT instance's config —
          # a routed `put` at a NON-DEFAULT alias (until it landed both `<MULTICFG>` rows were
          # `routes --check`, so the routed WRITE path had no cross-client byte comparison at
          # all), three routed READS, and a routed `validate` whose COUNT caught a defect in the
          # ORACLE.
          # ⚠ THE FLOOR IS NOT REDUNDANT WITH "ZERO FAILURES". A run that compared nothing has
          # zero failures too; the floor is what tells a green gate from an absent one.
          # 🔴 AND IT IS RAISED WITH EVERY ROW THAT LANDS. It sat at 98 for four rows after the
          # rows were added, which is a floor that cannot see the four newest disappear.
          if [ "$passes" -lt 104 ]; then
            echo "REFUSING: $passes passes, and 104 were measured — the gate got smaller"
            exit 1
          fi
          if [ "$fails" -ne 0 ]; then
            echo "REFUSING: $fails failing row(s)"
            exit 1
          fi
          # …and the harness's own two in-run controls, read rather than assumed.
          grep -q '^CONTENT-FLOOR live-banner=True rendered-digest=True' /tmp/parity.txt
          grep -q 'dead-normalizations=0' /tmp/parity.txt

  # 🔴 P1's LAST STEP, AND IT IS ITS OWN JOB FOR THE SAME REASON THE CORPUS AND THE PARITY
  # GATE ARE: its verdict is readable on its own in the checks list, and a failure in either
  # language can never mask it. It needs BOTH runtimes — the Python server is the oracle and
  # the Go one is under test — so it pins both pins.
  #
  # 🔴 IT RUNS MODE 2 ONLY, AND THAT IS NOT A SHORTCUT. Mode 1 is pointed at an operator's
  # real store, and this repository is PUBLIC: mode 1's per-target lines name that
  # operator's scopes, so its output belongs nowhere near a CI log. Mode 2's generated store
  # is synthetic by construction. `tests/dualrun/README.md` states what mode 2 can and
  # cannot stand in for; CI can only ever run the synthetic one.
  dualrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 🔴 THE CONTROLS FIRST, ALL THREE, BECAUSE TWO SERVERS FAILING IDENTICALLY COMPARE
      # EQUAL AND THIS GATE'S WHOLE OUTPUT IS AN EQUALITY. The P2 parity gate's first full
      # run reported 72 PASS / 0 FAIL while every request was refused; there is no reason
      # this shape would be safer.
      - name: prove every ARM can go RED (7 mutants, each on the comparison it names)
        run: python3 tests/dualrun/harness.py --self-test

      - name: prove the PRE-FLIGHT refuses two servers that both answer nothing
        run: |
          set +e
          python3 tests/dualrun/harness.py --break-both > /tmp/dualrun-broken.txt 2>&1
          rc=$?
          set -e
          cat /tmp/dualrun-broken.txt
          # exit 2 is "could not vouch", which is a DIFFERENT verdict from 1 ("a target
          # differs"). A 1 here would mean the gate had reported a comparison result over a
          # run in which nothing was comparable.
          if [ "$rc" -ne 2 ]; then
            echo "REFUSING: two servers configured to refuse every direct request produced"
            echo "          rc=$rc, not 2. The pre-flight is the only thing standing between"
            echo "          this gate and a green computed over two identical failures."
            exit 1
          fi
          grep -q 'REFUSING TO VOUCH' /tmp/dualrun-broken.txt

      # 🔴 THE POSITIVE CONTROL, AND IT IS A DIFFERENT CLAIM FROM THE OTHER TWO. They prove
      # the gate can go red; this proves the COUNT is counting the store. A harness
      # enumerating a hardcoded list would print the same reassuring number over an empty one.
      - name: prove the comparison count MOVES when the store grows
        run: python3 tests/dualrun/harness.py --positive-control

      - name: the dual-run gate
        run: |
          # 🔴 `set -euo pipefail` EXPLICITLY, AND NOT BECAUSE OF A STYLE PREFERENCE. The
          # runner's default shell already carries `-e`, so a step can look correct while
          # depending on it — and a block whose verdict depends on the RUNNER's flags is one
          # whose verdict cannot be reproduced by running the same lines locally. MEASURED:
          # this block was first written with its `python3 - <<'PY'` check in the MIDDLE,
          # where the heredoc's `sys.exit(1)` is swallowed by the commands after it, and
          # under `bash -c` (no `-e`) it printed `REFUSING: 1 difference(s)` and exited 0.
          # Every assertion is now ordered so the exit status cannot be lost, and the
          # deciding check is LAST.
          set -euo pipefail
          python3 tests/dualrun/harness.py | tee /tmp/dualrun.txt
          passes=$(grep -c '^PASS ' /tmp/dualrun.txt || true)
          fails=$(grep -c '^FAIL ' /tmp/dualrun.txt || true)
          echo "passes=$passes failures=$fails"
          # 363 PASS lines measured on this branch: 361 targets plus the audit-stream and
          # process-stream arms. ⚠ THE FLOOR IS NOT REDUNDANT WITH "ZERO FAILURES" — a run
          # that compared nothing has zero failures too, which is the whole reason the
          # summary reports a PAIR.
          if [ "$passes" -lt 363 ]; then
            echo "REFUSING: $passes passes, and 363 were measured — the gate got smaller"
            exit 1
          fi
          if [ "$fails" -ne 0 ]; then
            echo "REFUSING: $fails differing target(s)"
            grep '^FAIL ' /tmp/dualrun.txt
            exit 1
          fi
          # Every declared licence to differ must have FIRED. One that matched nothing is
          # either dead, or a difference that has been closed, or a pattern that stopped
          # matching and is now hiding a real difference.
          for name in date-header snapshot-gzip-envelope json-decoder-diagnostic \
                      audit-timestamp-instant listen-port; do
            grep -q "^DIFFERENCE $name " /tmp/dualrun.txt || {
              echo "REFUSING: the declared licence '$name' did not fire"; exit 1; }
          done
          # …and the two arms no other gate in this repository reads at all.
          grep -q '^PASS audit-stream' /tmp/dualrun.txt
          grep -q '^PASS process-stream' /tmp/dualrun.txt
          # 🔴 LAST, SO ITS EXIT STATUS IS THE STEP'S. The in-run numbers, read rather than
          # assumed — the comparison floor is what makes `differences=0` mean something.
          python3 - <<'PY'
          import re, sys
          text = open("/tmp/dualrun.txt").read()
          m = re.search(r"^SUMMARY targets=(\d+) comparisons=(\d+) differences=(\d+) "
                        r"entries=(\d+)$", text, re.M)
          if not m:
              print("REFUSING: no SUMMARY line — the run did not finish")
              sys.exit(1)
          targets, comparisons, differences, entries = (int(g) for g in m.groups())
          print(f"targets={targets} comparisons={comparisons} "
                f"differences={differences} entries={entries}")
          # Measured on this branch: 361 / 1489 / 0 / 119. Floors rather than equalities, so
          # ADDING a target is not a red gate; a NARROWING is.
          problems = []
          if targets < 361:
              problems.append(f"targets {targets} < 361")
          if comparisons < 1489:
              problems.append(f"comparisons {comparisons} < 1489")
          if entries < 119:
              problems.append(f"per-entry comparisons {entries} < 119")
          if differences:
              problems.append(f"{differences} difference(s)")
          if problems:
              print("REFUSING: " + "; ".join(problems))
              sys.exit(1)
          PY

  # 🔴 A FLAKE NOBODY BUILDS IS DECORATION, AND ITS ROT IS SILENT. `flake.nix`
  # is what a consumer pins — alpha-toolkit is the first — so a break here does not
  # surface in this repo at all: it surfaces in someone else's `home-manager
  # switch`, at the moment they wanted to read a note, with no obvious link back
  # to the commit that caused it. This job is what makes the flake an instrument
  # rather than a claim.
  #
  # Its own verdict is trustworthy for the same reason the suite's is: the
  # things being built REFUSE rather than warn. `packages.cairn` runs an
  # `installCheckPhase` that dies if the packaged client cannot import its own
  # `lib/`, and `checks.client-resolves-its-lib` runs a real subcommand and
  # fails on an ImportError. Neither can pass by doing nothing.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # 🔴 ONE `nix build` PER STEP, NOT ONE COMBINED INVOCATION. Concurrent
      # builds of sibling derivations contend on the store, and a contended run
      # can report a failure that a sequential run of the SAME tree does not
      # reproduce. Separate steps also mean the checks list says WHICH output
      # broke instead of "the nix job is red".
      - name: the client package builds, and can import its own lib/
        run: nix build .#packages.x86_64-linux.cairn --no-link --print-build-logs

      - name: the packaged client runs a real subcommand from /nix/store
        run: nix build .#checks.x86_64-linux.client-resolves-its-lib --no-link --print-build-logs

      # The image is built because it is what a deployment consumes, and
      # because a break in it is otherwise found only by whoever next tries to
      # ship the pod — which may be months later and someone else's problem.
      # This asserts it BUILDS; that it RUNS is not asserted here, and saying
      # so is the point: a green here is not a claim about a working pod.
      - name: the server image builds
        run: nix build .#packages.x86_64-linux.server-image --no-link --print-build-logs

      # 🔴 THE GO POD'S IMAGE IS BUILT HERE FOR THE REASON THE PYTHON ONE ABOVE IS, AND
      # ONE MORE. `tests/test_flake_go_image_runtime_contract.py` is a STRUCTURAL check on
      # `flake.nix` — it reads the declaration and is blind to layer contents by
      # construction — so nothing in the `tests` job can tell a declaration that builds
      # from one that does not. This step is that half. It asserts it BUILDS; that it
      # RUNS, can be seeded and can be rotated was measured by hand off the loaded image
      # at the commit that added it, and is not asserted here.
      - name: the Go server image builds
        run: nix build .#packages.x86_64-linux.server-image-go --no-link --print-build-logs

      # The Go server is packaged too, and its build RUNS the unit tests — so this
      # step is a second, independent reading of the `go` job's verdict under the
      # PINNED toolchain rather than the one `setup-go` installed. Two tiers, both
      # read: an environment silently decides which tests execute, and greening one
      # while the other stays unobservable moves a bug rather than removing it.
      - name: the Go server package builds, and its unit tests pass under the pinned toolchain
        run: nix build .#packages.x86_64-linux.cairn-server-go --no-link --print-build-logs

      # …and the binary's own route ledger is read out of the running binary,
      # which is the one claim a compile cannot make.
      - name: the Go server declares exactly the routes the ledger names
        run: nix build .#checks.x86_64-linux.go-server-declares-its-routes --no-link --print-build-logs

      # 🔴 THE UI IMAGE, AND THE TWO STEPS ARE LOAD-BEARING FOR DIFFERENT REASONS.
      # `tests/test_flake_ui_image_runtime_contract.py` reads `flake.nix` as TEXT and pins
      # it against `cmd/cairn-ui/main.go`'s own constants, so like its Go-pod sibling it
      # cannot tell a declaration that builds from one that does not. This step is that half.
      - name: the UI image builds
        run: nix build .#packages.x86_64-linux.ui-image --no-link --print-build-logs

      # …and this is the assertion NOTHING in the `tests` job can make. That job has Python
      # and pytest and NO nix, so the pytest copy of this assertion can only ever SKIP
      # there — a skip nobody counts is a pass. This reads the session directory's OWNERSHIP
      # out of the built layers, which is exactly what the Go pod's own `chown` comment
      # records as having survived three smoke runs that all structurally ignored it.
      # Measured on the commit that added it: a `chown`-less image reports `(0, 0)` and this
      # step exits 1.
      - name: the UI image owns its session directory
        run: nix build .#checks.x86_64-linux.ui-image-owns-its-session-dir --no-link --print-build-logs

      # The Go CLIENT is packaged too, and for the same reasons: a consumer will eventually pin
      # it, and its build runs the unit tests under the PINNED toolchain rather than the one
      # `setup-go` installed. Two tiers, both read.
      - name: the Go client package builds, and its unit tests pass under the pinned toolchain
        run: nix build .#packages.x86_64-linux.cairn-go --no-link --print-build-logs

      # …and its verb and exit-code tables are read out of the running binary. This is the nix
      # tier of the claim `tests/test_go_client_ledgers.py` makes in the `go` job — a different
      # instrument in a different environment, which is the point: greening one tier while the
      # other stays unobservable moves a bug rather than removing it.
      - name: the Go client declares exactly the verbs and codes the ledger names
        run: nix build .#checks.x86_64-linux.go-client-declares-its-verbs --no-link --print-build-logs

      # 🔴 WHICH CLIENT THE UNQUALIFIED NAMES RESOLVE TO — AND THIS JOB IS THE ONLY ONE
      # THAT CAN ASSERT IT. The claim is about flake ATTRIBUTES, so reading it needs a
      # nix evaluator; the `tests` job has none, and a pytest test that shelled out to
      # `nix` there would skip or error, which is a pass nobody counts. It is a step of
      # its own rather than a `nix flake check` because this job builds explicit
      # attributes by design — a check nothing names is a check nothing runs.
      - name: packages.default and apps.default both resolve to the Go client
        run: nix build .#checks.x86_64-linux.default-is-the-go-client --no-link --print-build-logs

      # 🔴 THE BROWSER SURFACE BUILDS, AND ITS UNIT TESTS RUN UNDER THE PINNED
      # TOOLCHAIN. This is also the only CI step that builds ANY artefact with the
      # new `vendorHash` from a clean store, so a lock file and a hash that came
      # apart fail here rather than in a consumer's `nix build`.
      # ⚠ THERE IS NO `…-declares-its-routes` STEP FOR THE UI, UNLIKE THE POD AND THE
      # CLIENT, AND THE ASYMMETRY IS THE DECISION. Those two exist because a PYTHON-side
      # gate owns the contract and is blind to a compiled program — `requests.json` for
      # the pod's routes, argparse and an AST walk for the client's verbs — so reading
      # the ledger out of the running binary is a SECOND instrument in a second
      # environment. The UI has no Python side and no corpus: `ui.DeclaredRoutes()`
      # derives from the same map the dispatcher reads, and the only expectation is a
      # hand-written list. Printing that list from the binary and diffing it against a
      # third hand-written copy is the same claim down a longer path, so the Go test in
      # `internal/ui` — which runs in this build's own check phase — is the one mechanism
      # kept. If a later phase gives this surface an external corpus, the second tier
      # comes back with it.
      - name: the browser surface builds, and its unit tests pass under the pinned toolchain
        run: nix build .#packages.x86_64-linux.cairn-ui --no-link --print-build-logs
